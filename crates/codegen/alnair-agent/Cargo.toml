[package]
license = "Apache-2.0"
name = "alnair-agent"
version.workspace = true
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
alnair-hooks = { path = "../alnair-hooks" }
alnair-sampling-types = { path = "../alnair-sampling-types" }
alnair-tools = { path = "../alnair-tools" }
alnair-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
ignore = { workspace = true }
dirs = "6"
alnair-config = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
alnair-tool-types.workspace = true

[features]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
# The builder tests implement `MemoryBackend` / `MemoryWriteBackend` with a
# no-op double to assert which memory tools reach the toolset. Both traits are
# `#[async_trait]`, so the impl side needs the same macro.
async-trait = { workspace = true }

[lints]
workspace = true

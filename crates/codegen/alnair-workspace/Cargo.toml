[package]
license = "Apache-2.0"
name = "alnair-workspace"
version.workspace = true
edition.workspace = true
description = "Core host-local workspace library (FS, VCS, execution, discovery) for alnair-shell and remote sampler"

[dependencies]
anyhow = { workspace = true }
arc-swap = { workspace = true }
dunce = { workspace = true }
alnair-version = { workspace = true }
async-stream = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
fs2 = { workspace = true }
dirs = "6"
parking_lot = { workspace = true }
git2 = { workspace = true }
ignore = { workspace = true }
md5 = { workspace = true }
regex = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "fs",
    "io-std",
    "macros",
    "process",
    "rt",
    "rt-multi-thread",
    "sync",
] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
alnair-agent = { path = "../alnair-agent" }
alnair-tools = { path = "../alnair-tools" }
alnair-tools-api = { path = "../alnair-tools-api" }
alnair-workspace-types = { path = "../alnair-workspace-types" }
alnair-config = { workspace = true }
# Leaf config value types (RemoteSettings, BoolFlag) for the folder-trust decision.
alnair-config-types = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
dashmap = { workspace = true }
agent-client-protocol = { workspace = true }
alnair-acp-lib = { workspace = true }
alnair-codebase-graph = { path = "../alnair-codebase-graph" }
alnair-paths = { path = "../alnair-paths" }
base64 = { workspace = true }
infer = { workspace = true }
sha2 = { workspace = true, features = ["force-soft"] }
bstr = "1.12.1"
hashbrown = "0.16.1"
nohash-hasher = "0.2.0"
rustc-hash = "2.1.1"
nucleo = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
smallvec = { workspace = true }
chrono = { workspace = true }
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
url = { workspace = true }
alnair-env = { workspace = true }
humantime-serde = { workspace = true }
prometheus = { workspace = true }
glob = "0.3"
alnair-sandbox = { path = "../alnair-sandbox", default-features = false }
alnair-hooks = { path = "../alnair-hooks" }
alnair-hunk-tracker = { path = "../alnair-hunk-tracker" }
alnair-mcp = { path = "../alnair-mcp" }
alnair-file-utils = { path = "../alnair-file-utils" }
alnair-auth = { path = "../alnair-auth" }
alnair-log = { workspace = true }
alnair-tty-utils = { workspace = true }
alnair-sqlite-journal = { workspace = true }
alnair-tool-protocol = { workspace = true }
alnair-tool-runtime = { workspace = true }
alnair-tool-types = { workspace = true }
tokio-util = { workspace = true }
urlencoding = "2"
alnair-fast-worktree = { path = "../alnair-fast-worktree", features = ["metadata"] }

alnair-fsnotify = { path = "../alnair-fsnotify" }
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
zstd = { workspace = true }

# Only referenced by the Unix foreign-session capability probe (O_DIRECTORY etc.).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = ["sandbox-enforce"]
compression = []
sandbox-enforce = ["alnair-sandbox/enforce"]
# Exposes the `#[cfg(test)]` construction seams (`WorkspaceOps::for_test`,
# `WorkspaceHandle::for_test`, …) to dependent crates' test builds. Enable
# from a dependent's [dev-dependencies] entry only — never in production.
test-support = []
default-bazel = [
    "sandbox-enforce",
    ]

[dev-dependencies]
filetime = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
alnair-test-utils = { path = "../../common/alnair-test-utils" }

[lints]
workspace = true

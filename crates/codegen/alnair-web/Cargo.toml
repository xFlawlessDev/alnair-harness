[package]
name = "alnair-web"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Browser client for the Alnair leader: HTTP + WebSocket bridge"

[dependencies]
alnair-config = { workspace = true }
alnair-shell = { workspace = true }
alnair-version = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
base64 = { workspace = true }
fs2 = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
ring = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
subtle = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
webbrowser = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "full"] }

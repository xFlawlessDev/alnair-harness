[package]
name = "alnair-web"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Browser client for the Alnair leader: HTTP + WebSocket bridge"

[dependencies]
alnair-shell = { workspace = true }
alnair-version = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures = { workspace = true }
rand = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "sync", "rt", "time", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
webbrowser = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util", "full"] }

<!doctype html>
<html lang="%lang%" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			// Resolve the theme before first paint. A marketing page that flashes
			// white for a frame is the whole first impression, and this is the only
			// code that runs early enough to prevent it.
			(() => {
				try {
					const stored = localStorage.getItem('alnair-theme');
					const dark = !matchMedia('(prefers-color-scheme: light)').matches;
					const theme = stored === 'light' || stored === 'dark' ? stored : dark ? 'dark' : 'light';
					document.documentElement.dataset.theme = theme;
				} catch {
					// Storage can be blocked in private modes; the default stands.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<!--
  Alnair logo tile: the mark from web/src/lib/assets/logo-white.svg, unchanged,
  inset into a rounded black square for use as an avatar / README badge.
  Raster twin: assets/logo-tile.png (1024x1024, rendered from this file).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Rounded black plate; radius is ~22% of the side (the app-icon proportion). -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="#000000"/>
  <!-- Hairline so the tile keeps an edge against a dark README background. -->
  <rect x="1" y="1" width="1022" height="1022" rx="223" ry="223"
        fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Mark: the 1000-unit art box scaled to 680 and centred (172 units of padding). -->

name: Release

# On a v* tag push, build the single-file alnair binary for the five supported
# targets, package alnair-<version>-<target-triple>.{tar.gz|zip} (binary +
# LICENSE + NOTICE + THIRD-PARTY-NOTICES), and publish them as a GitHub Release
# alongside SHA256SUMS. install.sh, install.ps1 and
# auto_update::release_asset_name() all resolve these exact names — keep the
# naming in lockstep with them.
#
# The release is created as a draft and only made public once SHA256SUMS is
# attached, so `releases/latest` never hands the installer a release whose
# checksum manifest is still missing.
#
# The web UI is built before the Rust build in every leg. Without it the binary
# embeds the "not built" placeholder page that `alnair web` serves.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Matches the version pinned by the dotslash launcher in bin/protoc. That
  # launcher is not used here: it has no Windows entry, so every platform
  # fetches protoc directly.
  PROTOC_VERSION: "29.3"

jobs:
  check-version:
    name: check tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with Cargo.toml
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $cargo_version" >&2
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            protoc: linux-x86_64
            ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            protoc: linux-x86_64
            ext: tar.gz
            cross_gnu: true
          - target: aarch64-apple-darwin
            runner: macos-14
            protoc: osx-aarch_64
            ext: tar.gz
          - target: x86_64-apple-darwin
            runner: macos-14
            protoc: osx-aarch_64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            protoc: win64
            ext: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # ── web UI ────────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          # Same Node and npm as the local build that produced web/package-lock.json.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI
        shell: bash
        run: |
          set -eu
          npm install -g npm@12.0.2
          npm --prefix web ci
          npm --prefix web run build
          # A placeholder build still produces a working binary, just with a
          # useless UI. Fail here instead of shipping it.
          test -d web/build/_app

      # ── linux cross toolchain ─────────────────────────────────────────────
      - name: Install aarch64 cross toolchain
        if: matrix.cross_gnu
        shell: bash
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          {
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
            echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
            echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++"
            echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
          } >> "$GITHUB_ENV"

      # ── protoc ────────────────────────────────────────────────────────────
      - name: Install protoc (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -eu
          url="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${{ matrix.protoc }}.zip"
          curl -fsSL -o protoc.zip "$url"
          rm -rf "$HOME/protoc"
          unzip -q -o protoc.zip -d "$HOME/protoc"
          chmod +x "$HOME/protoc/bin/protoc"
          echo "$HOME/protoc/bin" >> "$GITHUB_PATH"

      - name: Install protoc (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v$env:PROTOC_VERSION/protoc-$env:PROTOC_VERSION-${{ matrix.protoc }}.zip"
          Invoke-WebRequest -Uri $url -OutFile protoc.zip
          $dest = Join-Path $env:USERPROFILE "protoc"
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Expand-Archive protoc.zip -DestinationPath $dest -Force
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "bin")

      # ── toolchain ─────────────────────────────────────────────────────────
      # rust-toolchain.toml pins the channel; `rustup show` materialises it.
      - name: Install toolchain
        shell: bash
        run: |
          set -eu
          rustup show
          rustup target add ${{ matrix.target }}

      # ── build ─────────────────────────────────────────────────────────────
      - name: Build alnair
        shell: bash
        run: cargo build --profile release-dist -p alnair-bin --locked --target ${{ matrix.target }}

      # ── package and checksum ──────────────────────────────────────────────
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          archive="alnair-${version}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release-dist/alnair" "$staging/alnair"
          cp LICENSE "$staging/"
          [ -f NOTICE ] && cp NOTICE "$staging/"
          for f in THIRD-PARTY-NOTICES THIRD-PARTY-NOTICES.md; do
            [ -f "$f" ] && cp "$f" "$staging/"
          done
          tar -C "$staging" -czf "$archive" .
          sha256sum "$archive" > "checksum-${{ matrix.target }}.txt" 2>/dev/null \
            || shasum -a 256 "$archive" > "checksum-${{ matrix.target }}.txt"
          cat "checksum-${{ matrix.target }}.txt"

      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $archive = "alnair-$version-${{ matrix.target }}.zip"
          $staging = Join-Path $env:RUNNER_TEMP "staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release-dist/alnair.exe" (Join-Path $staging "alnair.exe")
          Copy-Item LICENSE $staging
          if (Test-Path NOTICE) { Copy-Item NOTICE $staging }
          foreach ($f in @("THIRD-PARTY-NOTICES", "THIRD-PARTY-NOTICES.md")) {
            if (Test-Path $f) { Copy-Item $f $staging }
          }
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath $archive -Force

          # sha256sum's exact format, so the publish job can just concatenate.
          # ASCII keeps the BOM out — a BOM would corrupt the first hash.
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLowerInvariant()
          "$hash  $archive" | Out-File -FilePath "checksum-${{ matrix.target }}.txt" -Encoding ascii
          Get-Content "checksum-${{ matrix.target }}.txt"

      - name: Upload archive and checksum
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            alnair-*.${{ matrix.ext }}
            checksum-${{ matrix.target }}.txt
          if-no-files-found: error

  publish:
    name: publish release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS
        shell: bash
        working-directory: dist
        run: |
          set -eu
          # The Windows line arrives CRLF-terminated; strip CR so every line is
          # LF for install.sh's `read -r hash name`.
          cat checksum-*.txt | tr -d '\r' | grep -v '^$' | sort -k2 > SHA256SUMS
          lines="$(wc -l < SHA256SUMS)"
          if [ "$lines" -ne 5 ]; then
            echo "expected 5 checksum lines, got $lines" >&2
            cat SHA256SUMS >&2
            exit 1
          fi
          rm checksum-*.txt
          cat SHA256SUMS

      - name: Create draft release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: dist
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in *-*) prerelease_flag="--prerelease" ;; esac

          # Release notes come from this version's CHANGELOG.md section.
          notes="$(mktemp)"
          sed -n "/^## \[${version}\]/,/^## \[/p" "$GITHUB_WORKSPACE/CHANGELOG.md" \
            | sed '1d;$d' > "$notes"
          notes_flag="--notes-file $notes"
          if [ ! -s "$notes" ]; then notes_flag="--generate-notes"; fi

          # Re-running a failed tag build reuses the draft instead of erroring.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Reusing existing release $GITHUB_REF_NAME"
          else
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "$GITHUB_REF_NAME" $prerelease_flag $notes_flag
          fi

          gh release upload "$GITHUB_REF_NAME" --clobber \
            alnair-*.tar.gz alnair-*.zip SHA256SUMS

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # Flip the draft public only now that every asset install.sh looks
          # for is attached.
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "Published $GITHUB_REF_NAME"
